version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: namoz
      POSTGRES_PASSWORD: namoz
      POSTGRES_DB: namoz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
